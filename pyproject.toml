[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simmer"
version = "0.1.0"
description = "SimMeR: phenotype-aware DNA methylation cohort simulation (cVAE prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.scripts]
simmer = "simmer.cli:main"

[tool.setuptools]
packages = ["simmer"]
